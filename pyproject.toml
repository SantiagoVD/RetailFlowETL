[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailflow-serverless-etl"
version = "1.0.0"
description = "A single-Lambda serverless retail ETL pipeline"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34,<2", "pandas>=2.2,<3", "pyarrow>=16,<20", "openpyxl>=3.1,<4", "PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [".aws-sam", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

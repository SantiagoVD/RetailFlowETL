AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RetailFlow Serverless ETL - one Lambda, S3 and CloudWatch.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name supplied at deploy time.
  PandasLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:336392948345:layer:AWSSDKPandas-Python312:31
    Description: AWS SDK for pandas layer containing Lambda-compatible pandas and PyArrow.

Resources:
  RetailFlowBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt RetailFlowFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: input/

  RetailFlowRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RetailFlowDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/input/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/bronze/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/silver/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/gold/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/quarantine/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/metadata/*'

  RetailFlowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'retailflow-etl-${Environment}'
      CodeUri: src
      Handler: retailflow_etl.handler.etl_handler.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 840
      EphemeralStorage: { Size: 2048 }
      Role: !GetAtt RetailFlowRole.Arn
      Layers:
        - !Ref RetailFlowDependenciesLayer
        - !Ref PandasLayerArn
      Environment:
        Variables:
          DATA_BUCKET: !Ref BucketName
          INPUT_PREFIX: input
          OUTPUT_PREFIX: ''
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'

  RetailFlowInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RetailFlowFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
      SourceAccount: !Ref AWS::AccountId

  RetailFlowDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'retailflow-dependencies-${Environment}'
      ContentUri: layers/etl-dependencies
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      Description: Linux-compatible pandas, PyArrow, openpyxl and YAML dependencies.
    Metadata:
      BuildMethod: python3.12

  RetailFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RetailFlowFunction}'
      RetentionInDays: 14

Outputs:
  DataBucketName:
    Value: !Ref RetailFlowBucket
  FunctionName:
    Value: !Ref RetailFlowFunction
  FunctionArn:
    Value: !GetAtt RetailFlowFunction.Arn
